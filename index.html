:125px;width:100%;object-fit:contain;background:#f2f6fb}.thumb a{display:block;text-decoration:none;color:#296aa9;padding:9px;word-break:break-all;font-size:12px}.progress{height:9px;background:#e5eef7;border-radius:10px;overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;background:var(--blue)}.tabs{display:flex;gap:8px;margin:15px 0}.tabs .active{background:#e7f1fc;color:var(--blue)}dialog{border:0;border-radius:14px;padding:26px;max-width:760px;width:calc(100% - 28px);max-height:90vh;overflow:auto;box-shadow:0 25px 80px #102e4d44}dialog::backdrop{background:#102e4d80}dialog h2{margin-top:0}footer{font-size:12px;color:var(--muted);padding:5px 0 20px}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:9px;padding:12px 20px;z-index:100;max-width:90vw;box-shadow:0 5px 20px #1235}a{color:var(--blue)}.metric{display:flex;align-items:end;gap:10px}.metric strong{font-size:30px}.barrow{display:grid;grid-template-columns:35px 1fr 50px;gap:10px;align-items:center;margin:12px 0}.list{padding:0;list-style:none}.list li{padding:11px 0;border-bottom:1px solid var(--line)}.small{font-size:12px;color:var(--muted)}

</style></head><body><header class="header"><div class="brand">OrthoGingiva · 正畸牙周研究平台<small>基线骨形态 × 四牙随访 × 结局复核</small></div><div class="head-actions"><span class="mode" id="mode">正在初始化…</span><button id="install" hidden>安装到桌面</button></div></header><div class="layout"><aside><nav id="nav"></nav><div class="navfooter">单中心研究测试版 V1.0<br>仅使用研究编号<br>不因研究增加常规CBCT</div></aside><main><div id="status"></div><div id="app"></div><footer>界面与示例阈值用于流程测试，正式研究前需锁定方案。测试版不提供个人风险预测。</footer></main></div><dialog id="dialog"></dialog><div id="toast" class="toast" hidden role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),T=['31','32','41','42'],KEY='OrthoGingiva_v1',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={patients:[],visits:[]},page='overview',selected='',api=false,token='',revision=0,readonly=false,currentVisit='',busy=false;
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random().toString(36).slice(2),today=()=>new Date().toLocaleDateString('en-CA'),options=(a,val)=>a.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('');
const pnow=()=>state.patients.find(p=>p.id===selected),vlist=()=>state.visits.filter(v=>v.patient===selected).sort((a,b)=>a.date.localeCompare(b.date));
const badge=s=>`<span class="badge ${s==='已审核'?'green':s==='待审核'||s==='需修正'?'amber':''}">${esc(s)}</span>`;
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,4200)}
async function request(url,opts={}){const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),'X-Study-Token':token}});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
async function commit(next){if(readonly)throw Error('服务离线，当前仅可查看，请恢复服务后刷新');if(busy)throw Error('正在保存，请稍后');busy=true;try{if(api){let d=await request('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...next,revision})});revision=d.revision}else{localStorage.setItem(KEY,JSON.stringify(next))}state=next;if(api){try{localStorage.setItem(KEY+'_servercache',JSON.stringify(next))}catch{}}}finally{busy=false}}
async function mutate(fn){let n=JSON.parse(JSON.stringify(state));fn(n);await commit(n)}
function notice(){const mode=api?'服务器模式 · SQLite + 附件目录':readonly?'服务器离线 · 只读缓存':'本地HTML演示 · 浏览器保存';$('#mode').textContent=mode;$('#status').innerHTML=`<div class="notice ${!api?'warning':''}">${api?'已连接本机后端。数据写入SQLite，附件保存至data/attachments。服务仅监听本机，尚未配置远程身份认证。':readonly?'后端连接失败，正在显示上次缓存。当前禁止修改；启动server.py后刷新页面。':'本地演示模式：数据仅保存在当前浏览器；不会写入同目录CSV或服务器数据库。请用模拟资料测试，并及时导出备份。'} </div>`}
const navs=[['overview','◈ 研究概览'],['patients','▣ 患者管理'],['baseline','◇ 基线测量'],['visits','▤ 牙周随访'],['files','▧ 附件照片'],['review','✓ 结局审核'],['export','⇩ 导出与设置']];
function render(){notice();$('#nav').innerHTML=navs.map(([id,t])=>`<button data-page="${id}" class="${page===id?'active':''}">${t}</button>`).join('');const fn={overview,patients,baseline,visits,files,review,export:exportsPage}[page];$('#app').innerHTML=fn();bind();if(page==='files')loadFiles()}
function heading(h,sub='',buttons=''){return `<div class="titlebar"><div><h1>${h}</h1><div class="sub">${sub}</div></div><div class="actions">${buttons}</div></div>`}
function picker(){return `<select class="patientselect" id="patientPicker"><option value="">请选择研究患者</option>${state.patients.map(p=>`<option value="${esc(p.id)}" ${p.id===selected?'selected':''}>${esc(p.code)} · ${esc(p.age)}岁 · ${esc(p.phase)}</option>`).join('')}</select>`}
function requirePatient(){return `<div class="card empty">请先选择患者，或在患者管理中新建病例。</div>`}
function sample(){let base={};T.forEach(t=>base[t]={b3:'',b6:'',b9:'',crest:'',root:'居中',defect:'未见明确表现',measure:'可测'});return {id:uid(),code:'DEMO-001',age:15,sex:'女',date:'2026-04-12',phase:'治疗中',debond:'',consent:true,indication:'示例：因复杂错合临床评估已完成CBCT',brush:'每日2次',phenotype:'薄型',plan:'非拔牙固定矫治',baseline:base,device:'示例设备',voxel:'0.2',measurer:'测量者A',notes:'全部为模拟资料，请勿当作真实病例。'}}
function overview(){let pending=state.visits.filter(v=>v.status==='待审核').length,approved=state.visits.filter(v=>v.status==='已审核').length,ev=state.visits.filter(v=>events(v).length).length;return heading('研究概览','连续入组 · 逐牙记录 · 审核留痕',`<button data-action="sample">载入示例病例</button><button class="primary" data-action="newpatient">＋ 新增患者</button>`)+`<div class="stats">${[['入组患者',state.patients.length],['随访记录',state.visits.length],['待审核',pending],['疑似事件随访',ev]].map(([a,b])=>`<div class="card stat"><span>${a}</span><strong>${b}</strong></div>`).join('')}</div><div class="two"><div class="card"><h2>研究进度</h2><div class="sub">计划160例 · 当前入组 ${state.patients.length}例</div><div class="progress"><i style="width:${Math.min(100,state.patients.length/160*100)}%"></i></div><p>已审核随访 ${approved} 条。疑似事件为流程提示，须由医师确认，不能直接解释为患者发生率。</p><h2>最近随访</h2>${visitSummary(state.visits.slice(-5).reverse())}</div><div class="card"><h2>待办与研究原则</h2><ul class="list"><li>完成基线四牙测量和牙周检查</li><li>每6个月随访，拆除后追加6个月</li><li>不可可靠测量的骨板不记为0</li><li>保留负值龈缘位置</li><li>不常规增加随访CBCT</li></ul><button data-page="visits">进入随访工作台 →</button></div></div>`}
function visitSummary(vs){return vs.length?`<div class="tablewrap"><table><tr><th>患者</th><th>日期</th><th>节点</th><th>状态</th></tr>${vs.map(v=>`<tr><td>${esc(state.patients.find(p=>p.id===v.patient)?.code)}</td><td>${esc(v.date)}</td><td>${esc(v.node)}</td><td>${badge(v.status)}</td></tr>`).join('')}</table></div>`:'<div class="empty">暂无记录，从新建病例开始。</div>'}
function patients(){return heading('患者管理','使用研究编号，不录入姓名、证件号或联系方式',`<button data-action="sample">载入示例</button><button class="primary" data-action="newpatient">＋ 新增患者</button>`)+`<div class="card"><input id="search" placeholder="搜索研究编号…" aria-label="搜索研究编号"><div class="tablewrap"><table><thead><tr><th>研究编号</th><th>年龄/性别</th><th>基线日期</th><th>治疗阶段</th><th>同意登记</th><th>操作</th></tr></thead><tbody id="patientRows">${patientRows(state.patients)}</tbody></table></div></div>`}
function patientRows(ps){return ps.map(p=>`<tr><td><strong>${esc(p.code)}</strong></td><td>${p.age} / ${esc(p.sex)}</td><td>${esc(p.date)}</td><td>${badge(p.phase)}</td><td>${p.consent?'已登记':'待核对'}</td><td><button data-edit="${esc(p.id)}">编辑</button> <button data-open="${esc(p.id)}">随访 →</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">暂无病例</td></tr>'}
function patientDialog(id){let p=state.patients.find(x=>x.id===id)||{age:15,sex:'女',date:today(),phase:'治疗中',brush:'每日2次',phenotype:'未评估'},edit=!!id;$('#dialog').innerHTML=`<h2>${edit?'编辑':'新增'}研究患者</h2><form id="patientForm"><div class="formgrid"><label>研究编号 *<input name="code" required maxlength="40" value="${esc(p.code)}" placeholder="GR-0001"></label><label>年龄 *<input name="age" type="number" required min="12" max="17" value="${p.age}"></label><label>性别<select name="sex">${options(['女','男','其他/不详'],p.sex)}</select></label><label>基线日期 *<input name="date" type="date" required value="${esc(p.date)}"></label><label>治疗阶段<select name="phase">${options(['治疗中','保持期','暂停','退出'],p.phase)}</select></label><label>实际拆除日期<input name="debond" type="date" value="${esc(p.debond)}"></label><label>刷牙习惯<select name="brush">${options(['每日2次','每日1次','每日3次及以上','不规律'],p.brush)}</select></label><label>牙龈表型<select name="phenotype">${options(['薄型','厚型','未评估'],p.phenotype)}</select></label><label>治疗方案<input name="plan" value="${esc(p.plan)}" maxlength="200"></label><label class="full">CBCT独立临床检查指征<input name="indication" value="${esc(p.indication)}" maxlength="300" placeholder="记录实际检查原因；不为研究追加检查"></label><label class="full">备注<textarea name="notes" maxlength="1000">${esc(p.notes)}</textarea></label></div><label class="check"><input type="checkbox" name="consent" ${p.consent?'checked':''}>监护人知情同意及受试者同意已按要求登记</label><div class="actions" style="margin-top:20px"><button type="button" data-close>取消</button><button class="primary">保存患者</button></div></form>`;$('#dialog').showModal();$('#patientForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),q={...p,id:p.id||uid(),...Object.fromEntries(f),age:Number(f.get('age')),consent:f.has('consent')};if(state.patients.some(z=>z.code===q.code&&z.id!==q.id))return toast('研究编号重复');if(q.debond&&q.debond<q.date)return toast('拆除日期不能早于基线');try{await mutate(n=>{let i=n.patients.findIndex(z=>z.id===q.id);i<0?n.patients.push(q):n.patients.splice(i,1,q)});selected=q.id;$('#dialog').close();render();toast('患者已保存')}catch(e){toast(e.message)}};$('#dialog').querySelector('[data-close]').onclick=()=>$('#dialog').close()}
function baseline(){let p=pnow();return heading('基线CBCT测量','现有影像软件测量 → 本平台登记 → 独立复核')+picker()+(p?`<form id="baseForm"><div class="card"><h2>${esc(p.code)} · 影像与测量信息</h2><div class="formgrid"><label>设备<input name="device" value="${esc(p.device)}"></label><label>体素（mm）<input name="voxel" type="number" min="0.05" max="1" step="0.01" value="${esc(p.voxel)}"></label><label>测量者<input name="measurer" value="${esc(p.measurer)}"></label><label class="full">独立临床检查指征<input name="indication" value="${esc(p.indication)}"></label></div></div><div class="card"><h2>四牙基线测量</h2><div class="tablewrap"><table><tr><th>指标</th>${T.map(t=>`<th>${t}</th>`).join('')}</tr>${[['b3','唇侧3mm层面厚度'],['b6','唇侧6mm层面厚度'],['b9','唇侧9mm层面厚度'],['crest','CEJ至唇侧嵴顶距离']].map(([k,l])=>`<tr><td>${l}（mm）</td>${T.map(t=>`<td><input aria-label="${t}${l}" name="${t}_${k}" type="number" min="0" max="30" step="0.1" value="${esc(p.baseline?.[t]?.[k])}"></td>`).join('')}</tr>`).join('')}<tr><td>可测性</td>${T.map(t=>`<td><select name="${t}_measure">${options(['可测','不可可靠测量','未测量'],p.baseline?.[t]?.measure||'未测量')}</select></td>`).join('')}</tr><tr><td>根骨位置</td>${T.map(t=>`<td><select name="${t}_root">${options(['未评估','居中','偏唇侧','偏舌侧'],p.baseline?.[t]?.root||'未评估')}</select></td>`).join('')}</tr><tr><td>骨缺损影像表现</td>${T.map(t=>`<td><select name="${t}_defect">${options(['未评估','未见明确表现','疑似骨开裂','疑似骨开窗','无法判断'],p.baseline?.[t]?.defect||'未评估')}</select></td>`).join('')}</tr></table></div><p class="small">厚度层面定义须由正式方案锁定。无法辨认薄骨板时保留缺失，并登记原因；不等于真实无骨。</p><button class="primary">保存基线测量</button> <button type="button" data-page="files">上传测量截图</button></div></form>`:requirePatient())}
function blankVisit(){let teeth={};T.forEach(t=>teeth[t]={gm:'',kg:'',pd:'',plaque:'未评估',bop:'未评估',missing:''});return {id:uid(),patient:selected,date:today(),node:'第6个月',status:'草稿',teeth,notes:'',recorder:'',reviewer:'',reviewNote:'',outcomes:{}}}
function visits(){let p=pnow(),vs=vlist(),v=vs.find(x=>x.id===currentVisit);return heading('牙周随访','龈缘根方为正、冠方为负；缺失与0分开记录')+picker()+(p?`<div class="two"><div><div class="card"><div class="titlebar"><h2>${esc(p.code)} · 随访记录</h2><button data-action="newvisit" class="primary">＋ 新建随访</button></div>${vs.length?`<select id="visitPicker"><option value="">选择记录查看或编辑</option>${vs.map(x=>`<option value="${esc(x.id)}" ${v?.id===x.id?'selected':''}>${esc(x.date)} · ${esc(x.node)} · ${esc(x.status)}</option>`).join('')}</select>`:'<p class="empty">暂无随访，请点击新建随访。</p>'}</div>${v?visitForm(v):''}</div><div><div class="card"><h2>时间轴与节点</h2><div class="timeline"><div class="event"><strong>${esc(p.date)} · 入组基线</strong><div class="small">建议建立一次基线牙周检查</div></div>${vs.map(x=>`<div class="event"><strong>${esc(x.date)} · ${esc(x.node)}</strong><div>${badge(x.status)} <button data-visit="${esc(x.id)}">打开</button></div></div>`).join('')}${p.debond?`<div class="event">${esc(p.debond)} · 已拆除<div class="small">保持期6个月目标：${addMonths(p.debond,6)}</div></div>`:''}</div></div><div class="card"><h2>下一节点提醒</h2><p>${nextVisit(p,vs)}</p><div class="small">按最近实际检查日期推算；需结合真实疗程确认预约。</div></div></div></div>`:requirePatient())}
function addMonths(d,n){let a=new Date(d+'T12:00:00'),day=a.getDate();a.setDate(1);a.setMonth(a.getMonth()+n);let last=new Date(a.getFullYear(),a.getMonth()+1,0).getDate();a.setDate(Math.min(day,last));return a.getFullYear()+'-'+String(a.getMonth()+1).padStart(2,'0')+'-'+String(a.getDate()).padStart(2,'0')}
function nextVisit(p,vs){if(p.phase==='退出')return '患者已退出，后续按实际情况处理。';let d=p.debond?addMonths(p.debond,6):addMonths(vs.at(-1)?.date||p.date,6);if(p.debond&&vs.some(v=>v.node==='拆除后6个月'))return '保持期6个月记录已建立，请核对完成情况。';return `${d} ${d<today()?'· 已过计划日期，请核对是否漏访':'· 建议复查日期'}`}
function visitForm(v){let locked=v.status==='已审核';return `<form id="visitForm" data-id="${esc(v.id)}"><div class="card"><div class="titlebar"><h2>${esc(v.node)} ${badge(v.status)}</h2>${locked?'<span class="small">已审核记录锁定</span>':''}</div><fieldset ${locked?'disabled':''} style="border:0;padding:0;margin:0"><div class="formgrid"><label>实际检查日期 *<input name="date" type="date" required value="${esc(v.date)}"></label><label>随访节点<select name="node">${options(['基线','第6个月','第12个月','第18个月','第24个月','拆除时','拆除后6个月','额外随访'],v.node)}</select></label><label>记录者 *<input name="recorder" required maxlength="80" value="${esc(v.recorder)}"></label></div><div class="tablewrap" style="margin-top:18px"><table><tr><th>检查指标</th>${T.map(t=>`<th>${t}</th>`).join('')}</tr>${[['gm','CEJ至龈缘距离',-10,15],['kg','角化龈宽度',0,20],['pd','探诊深度',0,15]].map(([k,l,min,max])=>`<tr><td>${l}（mm）</td>${T.map(t=>`<td><input aria-label="${t}${l}" type="number" min="${min}" max="${max}" step="0.5" name="${t}_${k}" value="${esc(v.teeth[t]?.[k])}"></td>`).join('')}</tr>`).join('')}${[['plaque','菌斑'],['bop','探诊出血']].map(([k,l])=>`<tr><td>${l}</td>${T.map(t=>`<td><select name="${t}_${k}">${options(['未评估','无','有'],v.teeth[t]?.[k]||'未评估')}</select></td>`).join('')}</tr>`).join('')}<tr><td>缺失原因</td>${T.map(t=>`<td><input name="${t}_missing" value="${esc(v.teeth[t]?.missing)}" placeholder="未测/无法辨认等" maxlength="120"></td>`).join('')}</tr></table></div><label style="margin-top:18px">治疗调整、移动信息、牙周干预及不良事件<textarea name="notes" maxlength="2000">${esc(v.notes)}</textarea></label><div class="actions" style="margin-top:18px"><button type="button" data-savevisit="草稿">保存草稿</button><button type="button" class="primary" data-savevisit="待审核">提交审核</button><button type="button" data-page="files">照片与附件</button></div></fieldset>${events(v).length?`<div class="notice warning" style="margin-top:18px">${events(v).map(t=>esc(t)+'牙达到疑似退缩阈值').join('；')}。此处仅为变化提示，须复核临床依据；主要终点仍按正式随访节点判定。</div>`:''}</div></form>`}
function baseVisit(patient){return state.visits.filter(v=>v.patient===patient&&v.node==='基线').sort((a,b)=>a.date.localeCompare(b.date))[0]}
function events(v){if(v.node==='基线')return [];let b=baseVisit(v.patient);if(!b)return [];return T.filter(t=>{let x=v.teeth?.[t]?.gm,y=b.teeth?.[t]?.gm;return x!==''&&x!=null&&y!==''&&y!=null&&Number(x)>=1&&Number(x)-Number(y)>=1})}
async function saveVisit(status){let form=$('#visitForm');if(!form.reportValidity())return;let v=state.visits.find(z=>z.id===form.dataset.id),f=new FormData(form),q={...v,date:f.get('date'),node:f.get('node'),recorder:f.get('recorder'),notes:f.get('notes'),status,teeth:{}};for(let t of T){q.teeth[t]={};for(let k of ['gm','kg','pd','plaque','bop','missing']){let z=f.get(t+'_'+k);q.teeth[t][k]=['gm','kg','pd'].includes(k)&&z!==''?Number(z):z}if(status==='待审核'&&q.teeth[t].gm===''&&!q.teeth[t].missing)return toast(t+'牙龈缘值缺失，请记录原因')}let p=pnow();if(q.date<p.date)return toast('随访日期不能早于基线日期');if(q.node==='基线'&&state.visits.some(z=>z.patient===selected&&z.node==='基线'&&z.id!==q.id))return toast('基线记录已存在，请编辑原记录');if(q.node==='拆除后6个月'&&!p.debond)return toast('请先登记实际拆除日期');q.updatedAt=new Date().toISOString();try{await mutate(n=>{n.visits[n.visits.findIndex(z=>z.id===q.id)]=q});render();toast(status==='待审核'?'已提交审核':'草稿已保存')}catch(e){toast(e.message)}}
function files(){return heading('照片与附件','支持PNG、JPEG和PDF；按患者关联，标题注明牙位和时间点')+picker()+(pnow()?`<div class="card"><h2>${esc(pnow().code)} · 上传资料</h2><p class="small">建议命名：研究编号_日期_牙位_资料类型。仅上传去标识化资料；单个文件不超过10MB。</p><input type="file" id="upload" accept="image/png,image/jpeg,application/pdf"><p class="small">${api?'后端模式：附件独立保存于data/attachments。':'本地演示：附件仅保存在浏览器，容量有限；JSON备份包含本地附件，CSV不包含附件。'}</p><div id="fileList" class="thumbs"></div></div>`:requirePatient())}
async function loadFiles(){try{let fs=api?await request('/api/attachments?patient='+encodeURIComponent(selected)):(pnow()?.files||[]);let el=$('#fileList');if(!el)return;el.innerHTML=fs.map(f=>{let url=api?'/api/file/'+encodeURIComponent(f.id):f.data;return `<div class="thumb">${f.mime.startsWith('image/')?`<img src="${esc(url)}" alt="${esc(f.name)}">`:'<div class="empty">PDF</div>'}<a href="${esc(url)}" target="_blank" rel="noopener">${esc(f.name)}</a></div>`}).join('')||'<div class="empty">暂无附件</div>'}catch(e){toast(e.message)}}
async function uploadFile(file){if(!file)return;if(file.size>10*1024*1024)return toast('文件不能超过10MB');if(!['image/png','image/jpeg','application/pdf'].includes(file.type))return toast('仅支持PNG、JPEG、PDF');try{if(api){await request('/api/attachments?patient='+encodeURIComponent(selected)+'&name='+encodeURIComponent(file.name),{method:'PUT',headers:{'Content-Type':file.type},body:file})}else{if(file.size>2*1024*1024)return toast('本地演示单文件限2MB；更大文件请运行后端');let data=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(Error('读取失败'));r.readAsDataURL(file)});await mutate(n=>{let p=n.patients.find(x=>x.id===selected);(p.files??=[]).push({id:uid(),name:file.name,mime:file.type,data})})}await loadFiles();toast('附件已保存')}catch(e){toast(e.message+'；本地模式容量不足时请先导出备份')}}
function review(){let vs=state.visits.filter(v=>v.status!=='草稿').sort((a,b)=>b.date.localeCompare(a.date));return heading('结局与记录审核','疑似事件自动提示；最终判定由医师确认')+`<div class="card"><div class="notice">示例提示规则：本次退缩≥1mm且较基线增加≥1mm。该规则尚需按预试验误差和正式方案锁定。已审核记录在页面内锁定。</div>${vs.length?vs.map(v=>`<div class="card" style="box-shadow:none"><div class="titlebar"><div><strong>${esc(state.patients.find(p=>p.id===v.patient)?.code)} · ${esc(v.date)} · ${esc(v.node)}</strong> ${badge(v.status)}<div class="sub">记录者：${esc(v.recorder)} · 疑似事件牙：${events(v).join('、')||'未提示/无基线可比较'}</div></div><button data-viewvisit="${esc(v.id)}">查看记录</button></div><form class="reviewForm" data-id="${esc(v.id)}"><div class="formgrid"><label>审核者 *<input name="reviewer" required maxlength="80" value="${esc(v.reviewer)}" ${v.status==='已审核'?'disabled':''}></label><label>临床退缩事件复核<select name="outcome" ${v.status==='已审核'?'disabled':''}>${options(['未完成判定','未确认事件','确认事件','无法判断'],v.outcome||'未完成判定')}</select></label><label>复核牙位（如确认事件）<input name="eventTeeth" value="${esc(v.eventTeeth)}" placeholder="如：41" ${v.status==='已审核'?'disabled':''}></label><label class="full">复核依据/数据质疑<textarea name="reviewNote" maxlength="2000" ${v.status==='已审核'?'disabled':''}>${esc(v.reviewNote)}</textarea></label></div>${v.status!=='已审核'?'<div class="actions" style="margin-top:12px"><button name="decision" value="需修正">退回修正</button><button class="primary" name="decision" value="已审核">确认并审核</button></div>':`<p class="small">已审核：${esc(v.reviewedAt||'')}。测试版不提供解锁修改入口。</p>`}</form></div>`).join(''):'<div class="empty">暂无提交审核的记录</div>'}</div>`}
function exportsPage(){return heading('数据导出与设置','导出长格式数据，保留患者、牙位和时间点关系')+`<div class="two"><div class="card"><h2>研究数据导出</h2><p>CSV为UTF-8 BOM编码，便于WPS、Excel及R读取；缺失值为空白，数值0保留。审核状态和复核结论分别导出。</p><div class="actions"><button class="primary" data-export="patients">患者CSV</button><button class="primary" data-export="teeth">四牙长表CSV</button><button data-action="backup">JSON数据备份</button><button data-action="dictionary">下载数据字典</button></div><p class="small">服务器完整备份须在关闭服务后复制整个data目录（含SQLite及附件）。JSON仅导出研究记录，不包含服务器独立附件及完整历史审计。</p></div><div class="card"><h2>研究配置 / 测试范围</h2><ul class="list"><li>目标入组：160例（方案规划值）</li><li>研究牙：31、32、41、42</li><li>随访：每6个月，拆除后6个月</li><li>本版本不提供风险预测与正式统计建模</li><li>本机服务尚未提供远程登录及权限管理</li></ul><button data-action="audit">查看服务器保存日志</button></div></div><div id="auditBox"></div><div class="card"><h2>测试版使用方式</h2><p>双击index.html可演示；运行server.py后访问 <strong>http://127.0.0.1:8765</strong>，进入SQLite与附件目录模式。数据模式互相独立，不会自动混合。</p><p>PWA安装需通过本机HTTP访问，推荐Chrome或Edge。只缓存界面；后端离线时不接受服务器模式写入，避免产生未经合并的数据副本。</p></div>`}
function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function csvCell(v){if(v===null||v===undefined)return '""';let s=String(v);if(typeof v!=='number'&&/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function csv(name,rows){download(name,'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function exportCSV(type){if(type==='patients'){let ks=['code','age','sex','date','phase','debond','consent','phenotype','brush','plan','indication'];csv('patients.csv',[ks,...state.patients.map(p=>ks.map(k=>p[k]))]);return}let head=['patient_code','visit_id','date','node','status','tooth','gm_mm','baseline_gm_mm','gm_change_mm','kg_mm','pd_mm','plaque','bop','missing_reason','suspected_event','confirmed_outcome','confirmed_event_teeth','b3_mm','b6_mm','b9_mm','crest_mm','bone_measurability','recorder','reviewer','review_note'];let rows=[head];for(let v of state.visits){let p=state.patients.find(p=>p.id===v.patient),b=baseVisit(v.patient);for(let t of T){let r=v.teeth[t]||{},bv=b?.teeth?.[t]?.gm,change=r.gm!==''&&r.gm!=null&&bv!==''&&bv!=null?Number(r.gm)-Number(bv):'',bone=p.baseline?.[t]||{};rows.push([p.code,v.id,v.date,v.node,v.status,t,r.gm,bv,change,r.kg,r.pd,r.plaque,r.bop,r.missing,events(v).includes(t)?1:0,v.outcome,v.eventTeeth,bone.b3,bone.b6,bone.b9,bone.crest,bone.measure,v.recorder,v.reviewer,v.reviewNote])}}csv('teeth_visits_long.csv',rows)}

async function action(a){try{if(a==='newpatient')return patientDialog();if(a==='sample'){if(state.patients.some(p=>p.code==='DEMO-001'))return toast('示例病例已存在');let p=sample();await mutate(n=>{n.patients.push(p);let v=blankVisit();v.patient=p.id;v.node='基线';v.date=p.date;v.recorder='示例记录者';T.forEach(t=>v.teeth[t]={gm:0,kg:3,pd:2,plaque:'无',bop:'无',missing:''});n.visits.push(v)});selected=p.id;render();return toast('已添加示例患者与基线检查')}if(a==='newvisit'){let v=blankVisit();if(!baseVisit(selected))v.node='基线';await mutate(n=>n.visits.push(v));currentVisit=v.id;render()}if(a==='backup')download('orthogingiva_records.json',JSON.stringify({exportedAt:new Date().toISOString(),mode:api?'server':'local',...state},null,2),'application/json');if(a==='dictionary')download('数据字典.txt','患者表：code=研究编号；age=基线年龄；date=基线日期；debond=拆除日期。\n长表一行=一次随访的一颗牙。gm_mm=带符号CEJ至龈缘距离，根方正/冠方负；baseline_gm_mm=基线值；gm_change_mm=较基线变化；kg_mm=角化龈宽度；pd_mm=探诊深度；缺失数值留空，0为真实数值。\nsuspected_event=基于当前示例阈值的提示，非最终结局；confirmed_outcome为人工判定；confirmed_event_teeth为审核者确认牙位。\nb3/b6/b9=对应参考层面的唇侧骨板厚度；crest=CEJ至嵴顶距离；bone_measurability=可测性。\nstatus=草稿/待审核/已审核/需修正。CSV包含所有状态，正式分析须筛选审核结果。患者内多牙及重复测量具有相关性。','text/plain;charset=utf-8');if(a==='audit'){if(!api)return toast('服务器模式才有独立保存日志');let list=await request('/api/audit');$('#auditBox').innerHTML='<div class="card"><h2>最近100条服务器日志</h2>'+list.map(x=>`<p>${esc(x.at)} · ${esc(x.action)} · ${esc(x.detail)}</p>`).join('')+'</div>'}}catch(e){toast(e.message)}}
